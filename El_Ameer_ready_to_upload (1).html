<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>El Ameer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link id="fontlink" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Cairo:wght@400;500;600;700&display=swap">
<style id="pagecss">
/* Layout: sticky bar with logo mark, logo-led hero, filterable product grid, aluminum facts band, basket + order form, FAQ. Palette sampled from the El Ameer logo. Single light look by choice. English and Arabic (RTL) share one page. */
:root{
  --bg:#F5F7F8; --surface:#FFFFFF; --ink:#15212B; --muted:#5B6369; --line:#D8DDE1;
  --blue:#116194; --blue-deep:#0C4A73; --steel:#8D8F8E; --tint:#E4EEF5; --ok:#1B6B44; --warn:#A5501A;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:'Barlow',system-ui,sans-serif;
  color-scheme:light;
}
html[lang="ar"]{--display:'Cairo',system-ui,sans-serif;--body:'Cairo',system-ui,sans-serif}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.05;text-wrap:balance;margin:0;letter-spacing:.01em}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{line-height:1.3;letter-spacing:0;text-transform:none}
p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.bar{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;direction:ltr}
.brand img{height:44px;width:auto;display:block}
.brand b{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:1.7rem;letter-spacing:.04em;color:var(--blue)}
.brand b i{font-style:normal;color:var(--steel)}
nav{display:flex;gap:18px;align-items:center}
nav a{text-decoration:none;font-size:.92rem;color:var(--muted);font-weight:500}
nav a:hover{color:var(--ink)}
.btn{font:inherit;font-weight:600;border:1px solid var(--blue);background:var(--blue);color:#fff;padding:12px 22px;border-radius:3px;cursor:pointer;text-decoration:none;display:inline-block;letter-spacing:.02em}
html[lang="ar"] .btn{letter-spacing:0}
.btn:hover{background:var(--blue-deep);border-color:var(--blue-deep)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--steel)}
.btn.ghost:hover{background:var(--tint);border-color:var(--blue)}
.btn.small{padding:8px 16px;font-size:.92rem}
@media(max-width:700px){nav a.hide-s{display:none}.brand b{font-size:1.4rem}nav{gap:10px}}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;padding-block:52px 44px}
@media(max-width:860px){.hero{grid-template-columns:1fr;padding-block:32px}.hero .logo-panel{order:-1;max-width:340px}}
.eyebrow{font-family:var(--display);font-size:1rem;letter-spacing:.18em;text-transform:uppercase;color:var(--blue);font-weight:600}
html[lang="ar"] .eyebrow{letter-spacing:0}
.hero h1{font-size:clamp(2.7rem,7vw,4.8rem);margin-block:12px 18px;text-transform:uppercase}
html[lang="ar"] .hero h1{font-size:clamp(2.3rem,6vw,3.9rem)}
.hero h1 span{color:var(--steel)}
.hero p.lead{color:var(--muted);max-width:46ch;font-size:1.1rem}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.logo-panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:28px;display:grid;place-items:center}
.logo-panel img{width:100%;max-width:340px;height:auto;display:block}
.strip{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:4px}
.strip div{padding:18px 20px;min-width:0}
.strip div+div{border-inline-start:1px solid var(--line)}
.strip strong{display:block;font-family:var(--display);font-size:1.35rem;font-weight:600;color:var(--blue)}
.strip span{color:var(--muted);font-size:.92rem}
bdi.ph{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;user-select:all}
@media(max-width:700px){.strip{grid-template-columns:1fr}.strip div+div{border-inline-start:0;border-top:1px solid var(--line)}}
section{padding-block:68px 4px}
.head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h2{font-size:clamp(2rem,4.6vw,3rem);text-transform:uppercase}
.head p{color:var(--muted);max-width:44ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chips button{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 16px;border-radius:99px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column;min-width:0}
.card .art{display:grid;place-items:center;height:170px;background:linear-gradient(180deg,#EEF2F5,#E3E9ED);border-bottom:1px solid var(--line)}
.card .art svg{height:130px;width:auto;max-width:90%}
.card .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:9px;flex:1}
.card h3{font-size:1.5rem}
html[lang="ar"] .card h3{font-size:1.25rem}
.tag{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--steel);font-weight:600}
html[lang="ar"] .tag{letter-spacing:0;font-size:.8rem}
.spec{color:var(--muted);font-size:.9rem}
.fin{display:flex;gap:10px;align-items:center}
.fin input{position:absolute;opacity:0;pointer-events:none}
.fin label{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.fin input:checked+label{box-shadow:0 0 0 2px var(--blue)}
.fin input:focus-visible+label{outline:2px solid var(--blue);outline-offset:3px}
.fin .fn{font-size:.85rem;color:var(--muted);margin-inline-start:auto}
.price{font-family:var(--display);font-size:1.7rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
html[lang="ar"] .price{font-size:1.4rem}
.price small{font-family:var(--body);font-size:.78rem;color:var(--muted);font-weight:400}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:4px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:40px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:36px}
@media(max-width:780px){.facts{grid-template-columns:1fr;padding:22px}}
.facts h2{font-size:clamp(1.9rem,4vw,2.8rem);text-transform:uppercase}
.facts p{color:var(--muted);margin-top:14px;max-width:48ch}
dl{margin:0}
dl div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
dl div:first-child{border-top:1px solid var(--line)}
dt{color:var(--muted)} dd{margin:0;font-weight:600;text-align:end}
.order{display:grid;grid-template-columns:1.1fr .9fr;gap:24px}
@media(max-width:860px){.order{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:22px;min-width:0}
.panel h3{font-size:1.6rem;margin-bottom:12px;text-transform:uppercase}
.line{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.line .nm{min-width:0}
.line .nm small{display:block;color:var(--muted)}
.qty{display:flex;align-items:center;gap:8px;margin-top:4px}
.qty button{width:28px;height:28px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;cursor:pointer;font:inherit}
.sum{display:grid;gap:6px;margin-top:14px;font-variant-numeric:tabular-nums}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum .tot{font-family:var(--display);font-size:1.7rem;font-weight:600;padding-top:8px;border-top:1px solid var(--line)}
.free{color:var(--ok);font-size:.92rem;margin-top:10px}
.empty{color:var(--muted);padding:12px 0}
form{display:grid;gap:12px}
label.f{display:grid;gap:4px;font-size:.88rem;color:var(--muted)}
input[type=text],input[type=tel],input[type=number],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:11px 12px;width:100%}
html[dir="rtl"] input[type=tel]{direction:ltr;text-align:right}
.msg{margin-top:8px;font-size:.92rem;min-height:1.4em}
.msg.ok{color:var(--ok)} .msg.err{color:var(--warn)}
details{border-bottom:1px solid var(--line);padding:16px 0}
details:first-of-type{border-top:1px solid var(--line)}
summary{cursor:pointer;font-weight:600}
details p{color:var(--muted);margin-top:8px;max-width:64ch}
footer{margin-top:72px;border-top:1px solid var(--line);padding-block:26px 40px;color:var(--muted);font-size:.9rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:.75rem;color:var(--muted)}
/* owner control panel, shown only to people who can edit this page */
#admin-root{direction:ltr;font-family:'Barlow',system-ui,sans-serif}
#admin-root .fab{position:fixed;z-index:25;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));font:inherit;font-weight:600;background:var(--ink);color:#fff;border:0;border-radius:99px;padding:11px 20px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#admin-root .scrim{position:fixed;inset:0;z-index:40;background:rgba(21,33,43,.5);display:flex;justify-content:flex-end}
#admin-root .box{background:var(--surface);color:var(--ink);width:min(480px,100%);height:100%;overflow:auto;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px))}
#admin-root h3{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:1.8rem;text-transform:uppercase;margin:0 0 6px}
#admin-root .hint{color:var(--muted);font-size:.9rem;margin-bottom:16px}
#admin-root .grp{border-top:1px solid var(--line);padding:14px 0;display:grid;gap:8px}
#admin-root .grp b{font-size:.95rem}
#admin-root .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#admin-root .three{display:grid;grid-template-columns:1fr 1fr 110px;gap:8px}
#admin-root .three input[dir=rtl]{text-align:right}
#admin-root .lbl{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#admin-root .acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
@media(max-width:520px){#admin-root .three{grid-template-columns:1fr 1fr}#admin-root .three .pr{grid-column:1/-1}}
@media(prefers-reduced-motion:no-preference){.btn{transition:background .15s}.card{transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(17,97,148,.12)}}

html{scroll-behavior:smooth}
textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:8px 10px;width:100%;min-height:60px;resize:vertical}
.chips button[aria-pressed="true"]{background:var(--blue);color:#fff}
#admin-root .scrim{justify-content:center;align-items:stretch}
#admin-root .box{width:min(960px,100%);padding-left:max(20px,env(safe-area-inset-left,0px))}
#admin-root .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px;position:sticky;top:0;background:var(--surface);padding:6px 0;z-index:2}
#admin-root .tabs button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px;border-radius:99px;cursor:pointer}
#admin-root .tabs button[aria-selected="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
#admin-root .ins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#admin-root .ins2{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:640px){#admin-root .ins,#admin-root .ins2{grid-template-columns:1fr 1fr}}
#admin-root .lead{border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin-bottom:10px;display:grid;gap:6px}
#admin-root .lead.new{border-inline-start:4px solid var(--blue);background:var(--tint)}
#admin-root .lead .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
#admin-root .lead a{color:var(--blue);font-weight:600}
#admin-root .tg{display:inline-block;background:var(--tint);border-radius:99px;padding:2px 10px;font-size:.82rem;margin:2px 4px 2px 0}
#admin-root .live{display:inline-flex;gap:6px;align-items:center;color:var(--ok);font-size:.85rem;font-weight:600}
#admin-root .live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.25}}
#admin-root .fab b{background:#fff;color:var(--ink);border-radius:99px;padding:0 7px;margin-inline-start:6px}
</style>

<div id="app"></div>
<div id="admin-root"></div>

    function say(x,c){var m=$('#ad-msg');if(m){m.className='msg '+(c||'');m.textContent=x}}
    function inp(l,list,i,f,v,type,dir){return '<label><span class="lbl">'+l+'</span><input type="'+(type||'text')+'" '+(dir?'dir="rtl" ':'')+'data-i="'+i+'" data-f="'+f+'" value="'+esc(v)+'"></label>'}
    function area(l,i,f,v,dir){return '<label><span class="lbl">'+l+'</span><textarea '+(dir?'dir="rtl" ':'')+'data-i="'+i+'" data-f="'+f+'">'+esc(v)+'</textarea></label>'}
    function keys(){var o=[];$$('[data-i18n]').forEach(function(el){var k=el.getAttribute('data-i18n');if(o.indexOf(k)<0)o.push(k)});return o}
    function curEn(k){var el=document.querySelector('[data-i18n="'+k+'"]');return el?el._en:''}
    function sync(){var b=$('#ad-body');if(!b)return;
      if(tab==='products'||tab==='faq'){var L=tab==='products'?D.items:D.faq;
        b.querySelectorAll('[data-i]').forEach(function(e){var o=L[+e.dataset.i];if(!o)return;o[e.dataset.f]=e.dataset.f==='price'?Math.max(0,Math.round(Number(e.value)||0)):(e.dataset.f==='stock'?(e.value===''?'':Math.max(0,Math.round(Number(e.value)||0))):e.value)})}
      if(tab==='texts')b.querySelectorAll('[data-k]').forEach(function(g){var k=g.dataset.k,en=g.querySelector('[data-l=en]').value,ar=g.querySelector('[data-l=ar]').value;
        if(en!==curEn(k)||ar!==(AR[k]||'')||D.texts[k])D.texts[k]={en:en,ar:ar}});
      if(tab==='settings'){D.phone=($('#ad-phone').value||'').trim()||D.phone;D.showPrice=$('#ad-sp').checked;D.showStock=$('#ad-st').checked;$$('[data-c]').forEach(function(e){var c=e.dataset.c;D.cats[c]=D.cats[c]||{};D.cats[c][e.dataset.l]=e.value});D.endpoint=($('#ad-ep').value||'').trim()}}
    function show(){
      var b=$('#ad-body'),h='';
      $$('.tabs button').forEach(function(x){x.setAttribute('aria-selected',x.dataset.t===tab)});
      if(tab==='leads'){
        h='<p class="live">Live</p> <span class="lbl">'+leads.length+' total</span>'+(STATE.endpoint?(bad?'<p class="hint">Cannot read inquiries. Check the password and the Google link in Settings.</p>':''):'<p class="hint">Inquiries are not connected yet. Open Settings and paste your Google Sheets link.</p>');
        h+=leads.length?leads.map(function(l){var tel=String(l.phone||'').replace(/[^\d+]/g,'');
          return '<div class="lead'+(l.done?'':' new')+'"><div class="top"><b>'+esc(l.name)+'</b><span class="lbl">'+esc(l.ts?new Date(l.ts).toLocaleString():'')+'</span></div>'+
          '<a href="tel:'+esc(tel)+'">'+esc(l.phone)+'</a><div>'+(l.interests||[]).map(function(x){return '<span class="tg">'+esc(x)+'</span>'}).join('')+'</div>'+(l.note?'<div>'+esc(l.note)+'</div>':'')+
          '<div class="acts" style="margin:0"><button class="btn ghost small" type="button" data-done="'+esc(l.id)+'">'+(l.done?'Mark as new':'Mark as contacted')+'</button><button class="btn ghost small" type="button" data-del="'+esc(l.id)+'">Delete</button></div></div>'}).join(''):'<p class="empty">No inquiries yet. They appear here the moment a visitor sends the form.</p>';
      }
      if(tab==='products'){
        h=D.items.map(function(p,i){return '<div class="grp"><b>'+esc(p.en||'New product')+'</b><div class="ins">'+inp('English name',i,'en',p.en)+inp('Arabic name',i,'ar',p.ar,0,1)+inp('Price (EGP)',i,'price',p.price,'number')+'</div>'+
          '<div class="ins"><label><span class="lbl">Category</span><select data-i="'+i+'" data-f="cat">'+CATS.map(function(c){return '<option value="'+c+'"'+(p.cat===c?' selected':'')+'>'+esc(T.en.cats[c])+'</option>'}).join('')+'</select></label>'+
          '<label><span class="lbl">Drawing</span><select data-i="'+i+'" data-f="type">'+['knob','lever','pull','profile','hinge','bar','frame','post'].map(function(c){return '<option'+(p.type===c?' selected':'')+'>'+c+'</option>'}).join('')+'</select></label></div>'+
          '<div class="ins">'+inp('Units in stock',i,'stock',p.stock==null?'':p.stock,'number')+'<div style="grid-column:span 2"><span class="lbl">Photo</span><span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+(p.img?'<img src="'+p.img+'" style="height:44px;border:1px solid var(--line)">':'')+'<input type="file" accept="image/*" data-img="'+i+'">'+(p.img?'<button type="button" class="btn ghost small" data-rmimg="'+i+'">Remove photo</button>':'')+'</span></div></div>'+'<div class="ins2">'+inp('Details (EN)',i,'sEn',p.sEn)+inp('Details (AR)',i,'sAr',p.sAr,0,1)+inp('Unit (EN)',i,'uEn',p.uEn)+inp('Unit (AR)',i,'uAr',p.uAr,0,1)+'</div>'+
          '<div class="acts" style="margin:0"><button class="btn ghost small" type="button" data-rm="'+i+'">Delete product</button></div></div>'}).join('')+'<div class="acts"><button class="btn small" type="button" id="ad-add">+ Add product</button></div>';
      }
      if(tab==='faq'){
        h=D.faq.map(function(f,i){return '<div class="grp"><div class="ins2" style="grid-template-columns:1fr 1fr">'+inp('Question (EN)',i,'qEn',f.qEn)+inp('Question (AR)',i,'qAr',f.qAr,0,1)+area('Answer (EN)',i,'aEn',f.aEn)+area('Answer (AR)',i,'aAr',f.aAr,1)+'</div>'+
          '<div class="acts" style="margin:0"><button class="btn ghost small" type="button" data-rm="'+i+'">Delete</button></div></div>'}).join('')+'<div class="acts"><button class="btn small" type="button" id="ad-add">+ Add question</button></div>';
      }
      if(tab==='texts'){
        h='<p class="hint">Every piece of text on the page. Change the English or Arabic wording. Simple tags like &lt;span&gt; are allowed.</p>'+keys().map(function(k){
          return '<div class="grp" data-k="'+esc(k)+'"><span class="lbl">'+esc(k)+'</span><div class="two"><textarea data-l="en">'+esc((D.texts[k]&&D.texts[k].en)||curEn(k))+'</textarea><textarea data-l="ar" dir="rtl">'+esc((D.texts[k]&&D.texts[k].ar)||AR[k]||'')+'</textarea></div></div>'}).join('');
      }
      if(tab==='settings'){
        h='<div class="grp" style="border-top:0"><label><span class="lbl">Sales phone number (shown on the page, call and WhatsApp buttons)</span><input type="text" id="ad-phone" value="'+esc(D.phone)+'"></label><label><span class="lbl">Google Sheets link for inquiries (see the setup steps)</span><input type="text" id="ad-ep" value="'+esc(D.endpoint||'')+'" placeholder="https://script.google.com/macros/s/.../exec"></label>'+
          '<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="ad-sp"'+(D.showPrice?' checked':'')+'> Show prices on product cards</label><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="ad-st"'+(D.showStock!==false?' checked':'')+'> Show units in stock on product cards</label></div>'+
          '<div class="grp"><b>Category names</b>'+CATS.map(function(c){return '<div class="two"><input type="text" data-c="'+c+'" data-l="en" value="'+esc(T.en.cats[c])+'"><input type="text" dir="rtl" data-c="'+c+'" data-l="ar" value="'+esc(T.ar.cats[c])+'"></div>'}).join('')+'</div>';
      }
      b.innerHTML=h;
    }
    function open(){
      if(scrim)return;scrim=document.createElement('div');scrim.className='scrim';
      scrim.innerHTML='<div class="box" role="dialog" aria-label="Admin"><h3>Admin</h3><div class="tabs" role="tablist">'+
        [['leads','Inquiries'],['products','Products'],['faq','Questions'],['texts','Page text'],['settings','Settings']].map(function(x){return '<button type="button" data-t="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>'+
        '<div id="ad-body"></div><div class="acts"><button type="button" class="btn" id="ad-save">Save and preview</button><button type="button" class="btn" id="ad-dl">Download updated site</button><button type="button" class="btn ghost" id="ad-close">Close</button></div><div class="msg" id="ad-msg" role="status"></div></div>';
      root.appendChild(scrim);show();
      scrim.addEventListener('change',function(e){var x=e.target;if(x.dataset.img===undefined||!x.files[0])return;sync();var i=+x.dataset.img,im=new Image(),rd=new FileReader();
        rd.onload=function(){im.onload=function(){var k=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
          var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);D.items[i].img=c.toDataURL('image/jpeg',.82);show()};im.src=rd.result};rd.readAsDataURL(x.files[0])});
      scrim.addEventListener('click',function(e){
        var x=e.target;if(x===scrim)return close();
        if(x.dataset.t){sync();tab=x.dataset.t;return show()}
        if(x.dataset.rmimg!==undefined){sync();D.items[+x.dataset.rmimg].img='';return show()}
        if(x.dataset.rm!==undefined){sync();(tab==='faq'?D.faq:D.items).splice(+x.dataset.rm,1);return show()}
        if(x.id==='ad-add'){sync();if(tab==='faq')D.faq.push({qEn:'',qAr:'',aEn:'',aAr:''});else D.items.push({id:'p'+Date.now().toString(36),cat:'door',type:'knob',en:'',ar:'',price:0,stock:'',img:'',sEn:'',sAr:'',uEn:'per piece',uAr:'للقطعة'});return show()}
        if(x.dataset.done&&STATE.endpoint){var l=leads.filter(function(y){return y.id===x.dataset.done})[0];post({action:'done',id:x.dataset.done,done:!(l&&l.done)})}
        if(x.dataset.del&&STATE.endpoint&&confirm('Delete this inquiry?'))post({action:'del',id:x.dataset.del});
        if(x.id==='ad-close')close();
        if(x.id==='ad-save')save();if(x.id==='ad-dl')dl();
      });
    }
    fab.onclick=open;
    window.__openAdmin=open;
    function dl(){sync();D.v=Date.now();var bl=new Blob([buildDoc(D)],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='El_Ameer.html';document.body.appendChild(a);a.click();a.remove();say('Downloaded. Upload this file to your hosting so everyone sees the changes.','ok')}
    function save(){sync();D.v=Date.now();try{localStorage.setItem('ea-state',JSON.stringify(D));say('Saved in this browser. Reloading preview.','ok');setTimeout(function(){location.reload()},600)}catch(e){say('Could not save here. Use Download instead.','err')}}
  }

  function boot(){
    async function go(){
      if(window.__openAdmin)return window.__openAdmin();
      if(STATE.endpoint){var pw=prompt('Admin password');if(pw===null)return;
        try{var r=await fetch(STATE.endpoint+(STATE.endpoint.indexOf('?')<0?'?':'&')+'action=list&key='+encodeURIComponent(pw));var a=await r.json();if(!Array.isArray(a))throw 0}
        catch(e){alert('Wrong password, or the Google link is not working.');return}
        window.__key=pw}
      buildAdmin();window.__openAdmin();
    }
    $('#navAdmin').addEventListener('click',function(e){e.preventDefault();go()});
    if(location.hash==='#admin')go();
    window.addEventListener('hashchange',function(){if(location.hash==='#admin')go()});
  }
  mount();wire();refresh();boot();
})();
</script>

</body></html>
